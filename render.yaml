services:
  - type: web
    name: bihar-12th-quiz-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_BACKUP
        sync: false
      - key: CHATGPT_API_KEY
        sync: false
      - key: CHATGPT_API_KEY_BACKUP
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_API_KEY_BACKUP
        sync: false
      - key: OPENAI_BASE_URL
        value: https://bedrock-mantle.ap-southeast-2.api.aws/v1
      - key: AI_MODEL
        value: deepseek.v3.1
      - key: DEFAULT_QUESTIONS_PER_QUIZ
        value: "100"
      - key: AUTO_NEXT_DELAY_SECONDS
        value: "3"
